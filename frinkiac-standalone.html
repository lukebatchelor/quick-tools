<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frinkiac Random Quote</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen py-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Simple Button component
    const Button = ({ children, onClick, disabled, className = '' }) => (
      <button
        onClick={onClick}
        disabled={disabled}
        className={`px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors ${className}`}
      >
        {children}
      </button>
    );

    // RefreshCw icon as SVG
    const RefreshCw = ({ className = '' }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
      >
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M3 21v-5h5" />
      </svg>
    );

    const FrinkiacQuote = () => {
      const [quote, setQuote] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);

      const fetchRandomQuote = async () => {
        setLoading(true);
        setError(null);
        try {
          const response = await fetch('https://frinkiac.com/api/random');
          if (!response.ok) {
            throw new Error('Failed to fetch quote');
          }
          const data = await response.json();

          // Fetch the caption for this frame
          const captionResponse = await fetch(`https://frinkiac.com/api/caption?e=${data.Episode.Key}&t=${data.Frame.Timestamp}`);
          const captionData = await captionResponse.json();

          setQuote({
            ...data,
            caption: captionData
          });
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const getImageUrl = () => {
        if (!quote) return null;
        return `https://frinkiac.com/meme/${quote.Episode.Key}/${quote.Frame.Timestamp}.jpg`;
      };

      const getCaptionText = () => {
        if (!quote || !quote.caption || !quote.caption.Subtitles) return '';
        return quote.caption.Subtitles.map(s => s.Content).join(' ');
      };

      return (
        <div className="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
          <div className="mb-6 text-center">
            <h2 className="text-2xl font-bold mb-2 text-gray-800">Frinkiac Random Quote</h2>
            <p className="text-gray-600">Get a random Simpsons quote and screenshot</p>
          </div>

          <div className="mb-6 text-center">
            <Button onClick={fetchRandomQuote} disabled={loading} className="inline-flex items-center gap-2">
              <RefreshCw className={loading ? 'animate-spin' : ''} />
              {loading ? 'Loading...' : 'Get Random Quote'}
            </Button>
          </div>

          {error && (
            <div className="mb-4 p-4 bg-red-100 text-red-700 rounded-lg">
              Error: {error}
            </div>
          )}

          {quote && (
            <div className="space-y-4">
              <div className="bg-gray-100 rounded-lg p-4">
                <img
                  src={getImageUrl()}
                  alt="Simpsons screenshot"
                  className="w-full rounded-lg shadow-md mb-4"
                />
                <div className="text-center">
                  <p className="text-lg font-medium text-gray-800 mb-2">
                    "{getCaptionText()}"
                  </p>
                  <p className="text-sm text-gray-600">
                    Season {quote.Episode.Season}, Episode {quote.Episode.EpisodeNumber}
                  </p>
                  <p className="text-sm text-gray-500">
                    "{quote.Episode.Title}"
                  </p>
                </div>
              </div>
            </div>
          )}

          {!quote && !loading && (
            <div className="text-center text-gray-500 py-8">
              Click the button to load a random Simpsons quote
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FrinkiacQuote />);
  </script>
</body>
</html>
